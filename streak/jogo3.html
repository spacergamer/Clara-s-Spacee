<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo 3 - Separar Maçãs (Versão Premium)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none; /* Bloqueia arrastar a tela no celular */
            font-family: 'Arial', sans-serif;
        }
        
        #gameCanvas {
            background-color: #fff;
            /* Mantém a proporção de celular perfeitamente sem amassar */
            height: 100vh;
            width: calc(100vh * (400 / 600));
            max-width: 100vw;
            max-height: calc(100vw * (600 / 400));
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #roundScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0,0,0,0.85);
            color: white;
            z-index: 10;
        }
        #roundScreen h1 {
            font-size: 60px;
            color: #4CAF50;
            text-shadow: 0 0 20px #fff;
            animation: popIn 1s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <audio autoplay loop src="assets/pou.mp3"></audio>

    <div id="roundScreen">
        <h1>ROUND 3</h1>
    </div>

    <!-- Resolução interna fixa 400x600 (não amassa as imagens) -->
    <canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const roundScreen = document.getElementById('roundScreen');

    let gameActive = false;
    setTimeout(() => {
        roundScreen.style.display = 'none';
        gameActive = true; 
    }, 2000);

    // IMAGEM DO ANJINHO
    const imgAnjinho = new Image();
    imgAnjinho.src = 'fotos/anjinho.jpeg';

    // CESTAS (Design novo)
    const baskets = [
        { type: 'green', x: 40, y: 420, w: 140, h: 120, color: '#C8E6C9', border: '#4CAF50', name: 'VERDES' },
        { type: 'red', x: 220, y: 420, w: 140, h: 120, color: '#FFCDD2', border: '#F44336', name: 'VERMELHAS' }
    ];

    // MAÇÃS
    const apples = [];
    const emojis = { 'green': '🍏', 'red': '🍎' };
    
    // Organiza as maçãs no centro da tela em duas fileiras
    function initApples() {
        let types = ['green', 'green', 'green', 'red', 'red', 'red'];
        types.sort(() => Math.random() - 0.5); // Embaralha
        
        let cols = 3;
        for (let i = 0; i < 6; i++) {
            let row = Math.floor(i / cols);
            let col = i % cols;
            
            let startX = 110 + (col * 90); // Espaçamento horizontal
            let startY = 230 + (row * 90); // Espaçamento vertical
            
            apples.push({
                type: types[i],
                emoji: emojis[types[i]],
                x: startX,          // Posição atual
                y: startY,
                targetX: startX,    // Para onde ela deve ir (animação)
                targetY: startY,
                originX: startX,    // O lugar inicial de onde ela não sai até acertar
                originY: startY,
                size: 35,           // Raio para o toque (hitbox)
                isLocked: false,
                scale: 1
            });
        }
    }
    initApples();

    // INTERAÇÃO MELHORADA
    let activeApple = null;

    // Pega a coordenada do toque convertida perfeitamente pro canvas
    function getPointerPos(evt) {
        const rect = canvas.getBoundingClientRect();
        let clientX = evt.clientX;
        let clientY = evt.clientY;

        if (evt.touches && evt.touches.length > 0) {
            clientX = evt.touches[0].clientX;
            clientY = evt.touches[0].clientY;
        }

        // Isso resolve o bug de amassar a tela
        return {
            x: (clientX - rect.left) / (rect.width / canvas.width),
            y: (clientY - rect.top) / (rect.height / canvas.height)
        };
    }

    function onPointerDown(e) {
        if (!gameActive) return;
        const pos = getPointerPos(e);
        
        // Pega a maçã que foi clicada (olha as do topo primeiro)
        for (let i = apples.length - 1; i >= 0; i--) {
            let a = apples[i];
            if (!a.isLocked) {
                // Checa distância do centro da maçã (Pitágoras)
                let dx = pos.x - a.x;
                let dy = pos.y - a.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance <= a.size + 15) { // +15 pra dar uma margem de erro boa no dedo
                    activeApple = a;
                    // Joga a maçã pro final pra ser desenhada por cima de todas
                    apples.splice(i, 1);
                    apples.push(activeApple);
                    
                    activeApple.scale = 1.3; // Dá uma crescida quando pega!
                    break;
                }
            }
        }
    }

    function onPointerMove(e) {
        if (activeApple) {
            e.preventDefault();
            const pos = getPointerPos(e);
            activeApple.x = pos.x;
            activeApple.y = pos.y;
            activeApple.targetX = pos.x; // Atualiza o alvo pro dedo
            activeApple.targetY = pos.y;
        }
    }

    function onPointerUp(e) {
        if (activeApple) {
            activeApple.scale = 1.0; // Volta ao tamanho normal
            
            let droppedInBasket = false;

            // Checa colisão com as cestas
            for (let b of baskets) {
                if (activeApple.x > b.x && activeApple.x < b.x + b.w &&
                    activeApple.y > b.y && activeApple.y < b.y + b.h) {
                    
                    if (activeApple.type === b.type) {
                        // ACERTOU A CESTA!
                        activeApple.isLocked = true;
                        // Escolhe um pontinho fixo e bonito dentro da cesta
                        activeApple.targetX = b.x + 30 + Math.random() * (b.w - 60);
                        activeApple.targetY = b.y + 50 + Math.random() * (b.h - 80);
                        droppedInBasket = true;
                    }
                }
            }

            // SE ERROU A CESTA OU SOLTOU FORA: VOLTA PRO LUGAR COMO ELÁSTICO!
            if (!droppedInBasket) {
                activeApple.targetX = activeApple.originX;
                activeApple.targetY = activeApple.originY;
            }

            activeApple = null;
            checkWin();
        }
    }

    function checkWin() {
        let allLocked = apples.every(a => a.isLocked);
        if (allLocked) {
            gameActive = false;
            setTimeout(() => {
                window.location.href = "jogo4.html";
            }, 1000);
        }
    }

    // Eventos
    canvas.addEventListener('touchstart', onPointerDown, {passive: false});
    canvas.addEventListener('touchmove', onPointerMove, {passive: false});
    window.addEventListener('touchend', onPointerUp);

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    function draw() {
        // FUNDO XADREZ DE PIQUENIQUE
        ctx.fillStyle = '#f8bBD0'; // Rosa claro
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        for(let i=0; i<600; i+=40) {
            ctx.fillRect(0, i, 400, 20); // Linhas horizontais
            ctx.fillRect(i, 0, 20, 600); // Linhas verticais
        }

        // CAIXA DE INSTRUÇÃO E MOLDURA DA ANJINHO
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath(); ctx.roundRect(20, 20, 360, 110, 20); ctx.fill();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.stroke();
        
        ctx.fillStyle = '#333';
        ctx.font = 'bold 22px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('Separe o pique-nique!', 140, 60);
        ctx.font = '16px Arial';
        ctx.fillText('Coloque cada cor', 140, 85);
        ctx.fillText('na cesta certa.', 140, 105);

        // FOTO REDONDA DA ANJINHO (MOLDURA PREMIUM)
        ctx.save();
        ctx.beginPath();
        ctx.arc(80, 75, 45, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip(); // Corta em círculo
        if (imgAnjinho.complete && imgAnjinho.naturalWidth !== 0) {
            ctx.drawImage(imgAnjinho, 35, 30, 90, 90);
        } else {
            ctx.fillStyle = '#FFEB3B';
            ctx.fillRect(35, 30, 90, 90);
        }
        ctx.restore();
        
        // Borda dourada na foto
        ctx.beginPath();
        ctx.arc(80, 75, 45, 0, Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#FFC107';
        ctx.stroke();

        // DESENHAR CESTAS
        for (let b of baskets) {
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.roundRect(b.x, b.y, b.w, b.h, 20); // Cesta arredondadinha
            ctx.fill();
            
            ctx.lineWidth = 6;
            ctx.strokeStyle = b.border;
            ctx.stroke();

            // Etiqueta da cesta
            ctx.fillStyle = b.border;
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(b.name, b.x + b.w / 2, b.y + b.h - 20);
        }

        // ATUALIZAR E DESENHAR MAÇÃS
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle'; // Ajuda a centralizar o toque exatamente na maçã
        
        for (let a of apples) {
            // Animação suave (Interpolação / Efeito Elástico)
            if (activeApple !== a) {
                a.x += (a.targetX - a.x) * 0.2;
                a.y += (a.targetY - a.y) * 0.2;
            }

            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.scale(a.scale, a.scale);

            // Sombra da maçã pra ficar chique
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(0, 20, 20, 5, 0, 0, Math.PI*2); ctx.fill();

            // A maçã em si (Emoji gigante)
            ctx.font = '60px Arial';
            ctx.fillText(a.emoji, 0, 0);
            
            ctx.restore();
        }
    }

    function loop() {
        draw();
        requestAnimationFrame(loop); // Loop mais limpo
    }

    loop();

</script>
</body>
</html>
