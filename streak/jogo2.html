<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo 2 - Cata Corações</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #FFDAB9; /* Cor pêssego suave */
            overflow: hidden;
            touch-action: none;
            font-family: 'Arial', sans-serif;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background-color: #FFDAB9;
        }
        
        /* Controles (Apenas Esquerda e Direita) */
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }
        .btn {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 4px solid #333;
            border-radius: 50%;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            user-select: none;
            box-shadow: 0 5px 0 #555;
        }
        .btn:active {
            background-color: #ddd;
            transform: translateY(5px);
            box-shadow: 0 0px 0 #555;
        }

        /* Placar no topo */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #333;
        }
        .score-text { color: #d32f2f; } /* Vermelho para acertos */
        .miss-text { color: #555; }     /* Cinza para erros */

        /* Telas de Aviso */
        #roundScreen, #gameOverScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0,0,0,0.8);
            color: white;
            z-index: 10;
        }
        #roundScreen h1 {
            font-size: 60px;
            color: #FFEB3B;
            text-shadow: 4px 4px #d32f2f;
            animation: popIn 1s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        #gameOverScreen h1 {
            font-size: 50px;
            color: #f44336;
            margin-bottom: 10px;
        }
        #gameOverScreen h2 {
            text-align: center;
            padding: 0 20px;
        }
        #gameOverScreen button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2E7D32;
        }
        #gameOverScreen button:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #2E7D32;
        }
    </style>
</head>
<body>
    <audio autoplay loop src="assets/pou.mp3"></audio>

    <!-- Tela do ROUND 2 -->
    <div id="roundScreen">
        <h1>ROUND 2</h1>
    </div>

    <!-- Tela de Game Over (Escondida no início) -->
    <div id="gameOverScreen" style="display: none;">
        <h1>GAME OVER</h1>
        <h2 id="gameOverReason">5 corações caíram! 😭</h2>
        <button onclick="location.reload()">Tentar de Novo</button>
    </div>

    <!-- Placar -->
    <div id="hud">
        <div class="score-text" id="scoreEl">Corações: 0 / 25</div>
        <div class="miss-text" id="missEl">Caíram: 0 / 5</div>
    </div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <!-- Controles -->
    <div id="controls">
        <div class="btn" id="btnLeft">←</div>
        <div class="btn" id="btnRight">→</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const missEl = document.getElementById('missEl');
    const roundScreen = document.getElementById('roundScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const gameOverReason = document.getElementById('gameOverReason');

    function resizeCanvas() {
        const scale = Math.min(window.innerWidth / 400, window.innerHeight / 600);
        canvas.style.width = (400 * scale) + 'px';
        canvas.style.height = (600 * scale) + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Sumir com a tela "ROUND 2" depois de 2 segundos
    setTimeout(() => {
        roundScreen.style.display = 'none';
        gameActive = true; 
        requestAnimationFrame(loop);
    }, 2000);

    // IMAGEM DO JOGADOR
    const imgAnjinho = new Image();
    imgAnjinho.src = 'fotos/anjinho.jpeg';

    // VARIÁVEIS DE JOGO
    let score = 0;
    let missed = 0;
    const maxScore = 25;
    const maxMiss = 5;
    let gameActive = false;
    let frameCount = 0;

    let keys = { left: false, right: false };

    // CONTROLES
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    function addControl(element, key) {
        element.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, {passive: false});
        element.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        element.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
        element.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
        element.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[key] = false; });
    }

    addControl(btnLeft, 'left');
    addControl(btnRight, 'right');

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
    });

    // JOGADOR
    const player = {
        x: 170, 
        y: 430, 
        width: 60, 
        height: 60,
        speed: 6,
        scaleX: 1, scaleY: 1
    };

    // ARRAY DE ITENS
    let hearts = [];

    function spawnHeart() {
        const size = 30;
        const x = Math.random() * (canvas.width - size * 2) + size; 
        
        // CAINDO MAIS DEVAGAR (velocidade entre 1.5 e 2.5)
        const speed = 1.5 + Math.random() * 1.0; 
        
        // Tem 20% de chance de ser um coração partido
        const isBroken = Math.random() < 0.2; 
        const emoji = isBroken ? '💔' : '❤️';
        
        hearts.push({ x: x, y: -40, size: size, speed: speed, emoji: emoji, isBroken: isBroken });
    }

    function update() {
        if (!gameActive) return;

        // Movimento do Jogador
        if (keys.left) {
            player.x -= player.speed;
            player.scaleX = 0.9; 
            player.scaleY = 1.1;
        }
        else if (keys.right) {
            player.x += player.speed;
            player.scaleX = 0.9;
            player.scaleY = 1.1;
        }
        else {
            player.scaleX += (1 - player.scaleX) * 0.2;
            player.scaleY += (1 - player.scaleY) * 0.2;
        }

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        // Gerar corações mais espaçados (a cada 50 frames)
        frameCount++;
        if (frameCount % 50 === 0) {
            spawnHeart();
        }

        // Atualizar Corações
        for (let i = hearts.length - 1; i >= 0; i--) {
            let h = hearts[i];
            h.y += h.speed;

            // Checar Colisão
            if (h.x < player.x + player.width &&
                h.x + h.size > player.x &&
                h.y < player.y + player.height &&
                h.y + h.size > player.y) {
                
                if (h.isBroken) {
                    // PEGOU CORAÇÃO PARTIDO = GAME OVER IMEDIATO
                    gameActive = false;
                    gameOverReason.innerText = "Você partiu meu coração... 💔😭";
                    gameOverScreen.style.display = 'flex';
                    return;
                } else {
                    // Pegou coração bom
                    score++;
                    scoreEl.innerText = `Corações: ${score} / ${maxScore}`;
                    hearts.splice(i, 1);
                    
                    if (score >= maxScore) {
                        gameActive = false;
                        window.location.href = "jogo3.html"; 
                    }
                }
            } 
            // Checar se passou da tela
            else if (h.y > canvas.height) {
                // Só conta como erro se for coração bom
                if (!h.isBroken) {
                    missed++;
                    missEl.innerText = `Caíram: ${missed} / ${maxMiss}`;
                    
                    if (missed >= maxMiss) {
                        gameActive = false;
                        gameOverReason.innerText = "5 corações bons caíram! 😭";
                        gameOverScreen.style.display = 'flex';
                    }
                }
                hearts.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Desenhar Chão
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(0, player.y + player.height - 10, canvas.width, canvas.height);

        if (!gameActive && roundScreen.style.display !== 'none') return; 

        // Desenhar Corações
        ctx.font = "30px Arial";
        for (let i = 0; i < hearts.length; i++) {
            let h = hearts[i];
            ctx.fillText(h.emoji, h.x, h.y + h.size);
        }

        // Desenhar Anjinho
        ctx.save();
        ctx.translate(player.x + player.width / 2, player.y + player.height);
        ctx.scale(player.scaleX, player.scaleY);
        
        if (imgAnjinho.complete && imgAnjinho.naturalWidth !== 0) {
            ctx.drawImage(imgAnjinho, -player.width / 2, -player.height, player.width, player.height);
        } else {
            ctx.fillStyle = '#FFEB3B';
            ctx.fillRect(-player.width / 2, -player.height, player.width, player.height);
        }
        ctx.restore();
    }

    function loop() {
        update();
        draw();
        if(gameActive){
            requestAnimationFrame(loop);
        }
    }

</script>
</body>
</html>
